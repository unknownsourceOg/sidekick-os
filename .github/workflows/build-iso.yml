name: build sidekick os iso

# Builds the bootable ISO on GitHub's free runners (x86_64 and arm64).
# live-build has to run inside a real Debian container - Ubuntu's patched live-build
# cannot bootstrap a Debian release.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  iso:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04       # Intel Mac, any PC
          - arch: arm64
            runner: ubuntu-24.04-arm   # Apple Silicon Mac inside UTM
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: free up disk
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: build inside debian trixie
        run: |
          chmod +x iso/build-iso.sh iso/sidekick-persist iso/sidekick-firstrun ai/setup-ai.sh
          docker run --rm --privileged \
            -v "$PWD:/repo" -w /repo \
            -e ARCH=${{ matrix.arch }} -e WORK=/tmp/skos \
            debian:trixie bash -euxc '
              apt-get update -qq
              apt-get install -y --no-install-recommends \
                live-build debian-archive-keyring ca-certificates curl file \
                xorriso squashfs-tools dosfstools mtools xz-utils \
                parted rsync procps
              iso/build-iso.sh
            '

      - name: report size
        id: size
        run: |
          f=sidekick-os-${{ matrix.arch }}.iso
          sz=$(stat -c%s "$f")
          echo "$f is $((sz/1024/1024)) MB"
          if [ "$sz" -lt 2100000000 ]; then echo "release=true" >> $GITHUB_OUTPUT
          else echo "release=false" >> $GITHUB_OUTPUT
               echo "::warning::ISO over 2 GB - too big for a Release asset, download it from Artifacts"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sidekick-os-${{ matrix.arch }}
          path: |
            sidekick-os-${{ matrix.arch }}.iso
            sidekick-os-${{ matrix.arch }}.iso.sha256
          retention-days: 30
          compression-level: 0

      - name: publish release
        if: steps.size.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$(date -u +%Y%m%d-%H%M)-${{ matrix.arch }}"
          gh release create "$tag" \
            --title "Sidekick OS (${{ matrix.arch }})" \
            --notes "Live bootable Sidekick OS.

          **amd64** = Intel Mac / any PC (hold Option at boot, pick EFI Boot).
          **arm64** = Apple Silicon Mac, run it in UTM (free).

          Flash with balenaEtcher, boot it, then:
          - \`sudo sidekick-persist\` keeps everything on the stick forever
          - the Install icon puts it on a real disk
          - first run offers the free local coding model (Qwen2.5-Coder, sized to your RAM)" \
            sidekick-os-${{ matrix.arch }}.iso sidekick-os-${{ matrix.arch }}.iso.sha256
